spring.application.name=multi-task-board-backend
spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker
spring.datasource.username=multitaskboard
spring.datasource.password=multitaskboard

server.port=8080

# Turn off the Spring Boot banner
spring.main.banner-mode=off

#Reduce logging level . Set logging level to warn
logging.level.root=warn

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=none

logging.level.org.springframework.security=DEBUG

app.jwt.secret=yutianMultiTaskBoardBackendSecretKey2026SecurityForApp
# 24h
app.jwt.expiration-ms=86400000